name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # .env.production (versionado) injeta VITE_BASE_URL_API=https://api-finance.josefelipedev.com
      - name: Build
        run: npm run build

      # wrangler vem das devDependencies (npm ci) — sem isso o npx tenta baixar
      # em runner não-interativo e falha com "npx canceled due to missing packages"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 46f2a7889afc9d49ec429792e23659bf
        run: npx --no-install wrangler pages deploy dist --project-name=finploit-finance --branch=main
